services:
  api:
    build:
      context: ./api
      target: debug
    command: /usr/local/bin/hoarder
    working_dir: /usr/src
    ports:
      - '8080:8080'
    environment:
      LOG_FORMAT: pretty
      LOG_LEVEL: debug,handlebars=info,hyper=info,tungstenite=info
      CLICOLOR_FORCE: '1'
      PORT: '8080'
      LOCALE: ja-JP
      PGHOST: database
      PGDATABASE: hoarder
      PGUSER: hoarder
      PGPASSWORD: hoarder
      PGSSLMODE: disable
      MEDIA_ROOT_DIR: /media
    user: '65534'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,nodev,noexec,nosuid
    volumes:
      - type: bind
        source: .
        target: /usr/src
      - type: volume
        source: media
        target: /media

  ui:
    build:
      context: ./ui
      target: debug
    command: yarn dev
    ports:
      - '3000:3000'
    environment:
      PORT: '3000'
      API_URL: http://api:8080
    user: '1000'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /home/node:uid=1000,gid=1000,nodev,noexec,nosuid
      - /tmp:mode=1777,nodev,exec,nosuid
      - /usr/src/.next:uid=1000,gid=1000,nodev,noexec,nosuid
    volumes:
      - type: bind
        source: ./ui
        target: /usr/src

  database:
    image: postgres:18.6
    ports:
      - '5432:5432'
    environment:
      PGUSER: hoarder
      POSTGRES_DB: hoarder
      POSTGRES_USER: hoarder
      POSTGRES_PASSWORD: hoarder
    user: '999'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run/postgresql:nodev,noexec,nosuid
      - /tmp:mode=1777,nodev,noexec,nosuid
    volumes:
      - type: volume
        source: database
        target: /var/lib/postgresql

volumes:
  database:
    driver: local
  media:
    driver: local
